<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Table Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    body {
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .question-preview * {
      all: revert;
    }

    .question-preview figure.table {
      display: block !important;
      margin: 8px 0 !important;
    }

    .question-preview table {
      display: table !important;
      border-collapse: collapse !important;
      border: 1px solid #d1d5db !important;
      margin: 8px 0 !important;
      width: auto !important;
    }

    .question-preview tbody {
      display: table-row-group !important;
    }

    .question-preview tr {
      display: table-row !important;
    }

    .question-preview td,
    .question-preview th {
      display: table-cell !important;
      border: 1px solid #d1d5db !important;
      padding: 8px 12px !important;
      text-align: center !important;
    }

    .question-preview th {
      background-color: #f9fafb !important;
      font-weight: 600 !important;
    }
  </style>
</head>
<body>
  <h1>Table Test</h1>
  <div class="question-preview">
    <figure class="table"><figure class="table"><figure class="table"><figure class="table"><table border="1">
    <tbody>
    <tr>
    <th style="width: 47.7376%; text-align: center;" scope="col"><math alttext="x"><mi>x</mi>
    </math></th>
    <th style="width: 47.7376%; text-align: center;" scope="col"><math alttext="y"><mi>y</mi>
    </math></th>
    </tr>
    <tr>
    <td style="width: 47.7376%; text-align: center;"><math alttext="k"><mi>k</mi>
    </math></td>
    <td style="width: 47.7376%; text-align: center;"><math alttext="13"><mn>13</mn>
    </math></td>
    </tr>
    <tr>
    <td style="width: 47.7376%; text-align: center;"><math alttext="k plus 7"><mrow>
      <mi>k</mi>
      <mo>+</mo>
      <mn>7</mn>
    </mrow>
    </math></td>
    <td style="width: 47.7376%; text-align: center;"><math alttext="negative 15"><mo>-</mo><mn>15</mn>
    </math></td>
    </tr>
    </tbody>
    </table></figure></figure></figure></figure>
    <p style="text-align: left;">The table gives the coordinates of two points on a line in the <em>xy</em>-plane.</p>
  </div>
</body>
</html>
